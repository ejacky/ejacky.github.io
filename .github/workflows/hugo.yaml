name: Build and deploy site

on:
  push:
    branches: [hugo]
  pull_request:
    branches: [hugo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # github.com/.../releases/download 当前会返回 504，改用 API 资产接口下载
      # （gh release download 走 api.github.com + 签名存储地址，带重试）。
      - name: Install Hugo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/hugo"
          for attempt in 1 2 3; do
            if gh release download "v${HUGO_VERSION}" --repo gohugoio/hugo \
              --pattern "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
              --dir "$RUNNER_TEMP/hugo" --clobber; then
              break
            fi
            echo "download attempt ${attempt} failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          tar -xzf "$RUNNER_TEMP/hugo/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hugo" version

      - name: Build
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/hugo'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
